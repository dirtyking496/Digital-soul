<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>ForgePocket — Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui}header{padding:16px 5%;background:#101827;border-bottom:1px solid #293a58;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:#9587ff}main{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{background:#141e32;border:1px solid #30415f;border-radius:16px;padding:18px;min-width:0}h2{font-size:18px;margin:0 0 12px}p,small{color:#aebbd2}label{display:block;margin:12px 0 6px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #405578;border-radius:9px;background:#091426;color:white;font:inherit}textarea{min-height:90px}.code{height:330px;font:13px monospace;white-space:pre;tab-size:2}.preview{width:100%;height:420px;background:white;border:0;border-radius:10px;margin-top:10px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{padding:11px 14px;border:0;border-radius:9px;background:#796cff;color:white;font-weight:700}button.alt{background:#2a3a55}.note{background:#10253a;border-radius:10px;padding:10px;font-size:12px;color:#c2d1e7}.msg{color:#54d6a6;min-height:24px;font-size:13px}.list{font-size:13px;line-height:2}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}.code{height:270px}.preview{height:360px}}
</style></head><body><header><div><div class="brand">✦ FORGE<span>POCKET</span></div><small>Studio de création Android</small></div><small id="health">Connexion…</small></header><main>
<section class="panel"><h2>Nouveau projet</h2><label>Nom</label><input id="name" value="Mon application" maxlength="50"><label>Modèle</label><select id="kind"><option value="landing">Page professionnelle</option><option value="portfolio">Portfolio</option><option value="notes">Application de notes</option></select><label>Description</label><textarea id="desc">Une application moderne, simple et utile.</textarea><div class="buttons"><button id="make">⚡ Générer</button><button class="alt" id="save">Sauvegarder</button></div><h2>Mes projets</h2><div id="projects" class="list">Aucun projet enregistré.</div><div class="buttons"><button class="alt" id="load">Charger le dernier</button></div><div class="note">100 crédits de démonstration. Aucun achat ni paiement réel activé. Les projets sont conservés sur cet appareil.</div></section>
<section class="panel"><h2>Éditeur de code</h2><label>index.html — modifiable</label><textarea id="code" class="code" spellcheck="false"></textarea><div class="buttons"><button id="refresh">Actualiser l’aperçu</button><button class="alt" id="check">Valider</button><button id="export">⬇ Exporter HTML</button><button class="alt" id="copy">Copier</button></div><h2>Aperçu isolé</h2><iframe id="view" class="preview" title="Aperçu" sandbox="allow-scripts allow-forms"></iframe><div id="msg" class="msg" aria-live="polite"></div></section></main>
<script>
const $=id=>document.getElementById(id);let project={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function build(){let n=esc($("name").value||"Mon application"),d=esc($("desc").value||"Créé avec ForgePocket");let html;if($("kind").value==="notes")html='<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+n+'</title><style>body{font:16px system-ui;background:#101827;color:white;padding:25px}.app{max-width:600px;margin:8vh auto;background:#1b2940;padding:25px;border-radius:18px}textarea{width:100%;height:120px;box-sizing:border-box}button{padding:12px;background:#8274ff;color:white;border:0;border-radius:8px}li{padding:10px}</style><div class="app"><h1>'+n+'</h1><p>'+d+'</p><textarea id="v" placeholder="Écris une note"></textarea><p><button id="add">Ajouter</button></p><ul id="list"></ul></div><script>let a=JSON.parse(localStorage.getItem("notes")||"[]");function draw(){list.innerHTML="";a.forEach((v,i)=>{let li=document.createElement("li");li.textContent=v;let b=document.createElement("button");b.textContent="×";b.onclick=()=>{a.splice(i,1);save()};li.append(b);list.append(li)})}function save(){localStorage.setItem("notes",JSON.stringify(a));draw()}add.onclick=()=>{if(v.value.trim()){a.unshift(v.value.trim());v.value="";save()}};draw();<\/script></html>';else if($("kind").value==="portfolio")html='<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+n+'</title><style>body{font:17px system-ui;background:#f1eee8;color:#20242c;margin:0;padding:8vh 8%}h1{font-size:clamp(40px,8vw,76px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}.card{background:white;padding:25px;border-radius:16px}</style><p>PORTFOLIO</p><h1>'+n+'</h1><p>'+d+'</p><div class="grid"><div class="card"><h3>Projet 01</h3>Présente une création.</div><div class="card"><h3>Projet 02</h3>Ajoute tes réalisations.</div><div class="card"><h3>Contact</h3>Coordonnées publiques.</div></div></html>';else html='<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+n+'</title><style>body{font:17px system-ui;background:#101827;color:white;margin:0}header{padding:25px 8%;border-bottom:1px solid #34435b}main{max-width:800px;margin:12vh auto;padding:25px}h1{font-size:clamp(42px,8vw,72px)}p{color:#bdc9dc;line-height:1.7}a{display:inline-block;background:#8274ff;color:white;padding:13px 18px;border-radius:10px;text-decoration:none}</style><header><b>'+n+'</b></header><main><h1>'+n+'</h1><p>'+d+'</p><a href="#info">Découvrir</a><p id="info">Projet généré avec ForgePocket.</p></main></html>';project={name:$("name").value,kind:$("kind").value,desc:$("desc").value,html};$("code").value=html;$("view").srcdoc=html;$("msg").textContent="Projet créé. Tu peux modifier le code et exporter le fichier.";}
$("make").onclick=build;$("refresh").onclick=()=>{$("view").srcdoc=$("code").value;project.html=$("code").value;$("msg").textContent="Aperçu actualisé."};
$("export").onclick=()=>{let b=new Blob([$ ("code").value],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(project.name||"forgepocket").replace(/[^a-z0-9-]/gi,"-")+".html";a.click();URL.revokeObjectURL(a.href);$("msg").textContent="Fichier HTML exporté sur ton appareil."};
$("save").onclick=()=>{project.html=$("code").value;let a=JSON.parse(localStorage.getItem("fp-projects")||"[]");a.unshift(project);localStorage.setItem("fp-projects",JSON.stringify(a.slice(0,20)));list();$("msg").textContent="Projet sauvegardé localement."};
function list(){let a=JSON.parse(localStorage.getItem("fp-projects")||"[]");$("projects").textContent=a.length?a.slice(0,5).map(x=>x.name).join(" • "):"Aucun projet enregistré."}
$("load").onclick=()=>{let p=JSON.parse(localStorage.getItem("fp-projects")||"[]")[0];if(!p)return $("msg").textContent="Aucun projet sauvegardé.";project=p;$("name").value=p.name;$("kind").value=p.kind;$("desc").value=p.desc;$("code").value=p.html;$("view").srcdoc=p.html;$("msg").textContent="Dernier projet chargé."};
$("check").onclick=async()=>{try{let r=await fetch("/api/validate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({files:{"index.html":$("code").value}})}),d=await r.json();$("msg").textContent=d.ok?"Projet valide • "+d.totalCharacters+" caractères":d.error}catch{$("msg").textContent="Validation serveur indisponible."}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("code").value);$("msg").textContent="Code copié."}catch{$("msg").textContent="Copie non autorisée par le navigateur."}};
fetch("/api/health").then(r=>r.json()).then(x=>$("health").textContent=x.ok?"Serveur prêt":"Serveur indisponible").catch(()=>$("health").textContent="Hors ligne");list();build();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script></body></html>
